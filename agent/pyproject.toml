[project]
name = "my-agent"
version = "0.1.0"
description = "CLI-агент для работы с LLM (OpenAI-compatible API) с мульти-агентностью"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.50",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
my-agent = "my_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках — намеренна

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["textual.*", "httpx_sse.*", "typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
