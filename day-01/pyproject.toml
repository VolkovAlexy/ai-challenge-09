[project]
name = "one-question"
version = "0.1.0"
description = "Простой клиент для OpenAI-compatible API (one question)"
authors = [
    { name = "Alex Volkov", email = "vlkv@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
one-question = "one_question:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
