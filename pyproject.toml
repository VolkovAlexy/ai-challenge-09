[project]
name = "agent"
version = "0.1.0"
description = "Веб-агент для работы с LLM (OpenAI-compatible API) с мульти-агентностью"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "mcp>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]

[project.scripts]
agent-web = "agent.web_server:main"
agent-dev = "agent.dev:main"
agent-mcp = "agent.tools.mcp_demo:main"
agent-mcp-mock = "mcp_demo.mcp_mock:main"
agent-mock-api = "mcp_demo.mock_api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках — намеренна

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["httpx_sse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
